<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A layered, visual edition of The System Design Primer by Donne Martin and contributors (CC BY 4.0)." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='5' fill='%236366f1'/><circle cx='16' cy='16' r='13' fill='none' stroke='%236366f1' stroke-width='2' stroke-dasharray='4 3'/></svg>" />
    <title>System Design Atlas</title>
    <script>
      try {
        var t = localStorage.getItem('atlas-theme');
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
